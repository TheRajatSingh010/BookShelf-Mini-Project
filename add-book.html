<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book - BookShelf</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <header>
        <nav>
            <div class="logo">
                <img src="Picture1.png" alt="BookShelf Logo">
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html">Books</a></li>
                <li><a href="favorites.html">Favorites</a></li>
                <li><a href="add-book.html">Add Book</a></li>
            </ul>
        </nav>
    </header>

    
    <div class="main-content">
        <h1 class="page-title">➕ Add a New Book</h1>

        <div class="form-container">
            <form id="addBookForm" enctype="multipart/form-data"> 
                
                <div class="form-group">
                    <label for="bookTitle">Book Title *</label>
                    <input type="text" id="bookTitle" name="title" required placeholder="Enter book title">
                </div>

                <div class="form-group">
                    <label for="bookAuthor">Author *</label>
                    <input type="text" id="bookAuthor" name="author" required placeholder="Enter author name">
                </div>

                <div class="form-group">
                    <label for="bookGenre">Genre *</label>
                    <select id="bookGenre" name="genre" required>
                        <option value="">Select a genre</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Non-Fiction">Non-Fiction</option>
                        <option value="Mystery">Mystery</option>
                        <option value="Science Fiction">Science Fiction</option>
                        <option value="Romance">Romance</option>
                        <option value="Thriller">Thriller</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Biography">Biography</option>
                        <option value="History">History</option>
                        <option value="Self-Help">Self-Help</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bookCover">Cover Emoji</label>
                    <input type="text" id="bookCover" name="cover" placeholder="📚 (optional, default: 📖)">
                </div>

                <div class="form-group">
                    <label for="bookPdf">Book PDF File *</label>
                    <input type="file" id="bookPdf" name="pdfFile" accept="application/pdf" required>
                </div>

                <div class="form-group">
                    <label for="bookDescription">Description</label>
                    <textarea id="bookDescription" name="description" placeholder="Brief description of the book (optional)"></textarea>
                </div>

                <button type="submit" class="btn-submit">Add Book to Library</button>
            </form>
        </div>
    </div>

    
    <footer>
        <p>&copy; 2025 BookShelf - Your Online Library. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
